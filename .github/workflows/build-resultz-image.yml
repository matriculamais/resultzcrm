# Gera a imagem Docker do fork Resultz e publica no GitHub Container Registry.
# Uso pelo painel do GitHub: aba Actions > "Build Resultz CRM image" > Run workflow.
name: Build Resultz CRM image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem (ex: latest, colegio-v1)"
        required: true
        default: "latest"

concurrency:
  group: build-resultz-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resultzcrm:${{ inputs.tag }}
          build-args: |
            APP_VERSION=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
